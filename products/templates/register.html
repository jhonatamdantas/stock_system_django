{% extends "base.html" %}

{% block title %}Cadastro{% endblock title %}

{% block content %}
<h1>Cadastre o item preenchendo os campos abaixo</h1>
<form method="post" class='form-control'>
    {% csrf_token %}
    <div class='input-control'>
        <label>{{form.name.label}}</label>
        {{form.name}}
        <br>
        <label>{{form.stock.label}}</label>
        {{form.stock}}
        <br>
        <label>{{form.cost_price.label}}</label>
        {{form.cost_price}}
        <br>
        <label>{{form.selling_price.label}}</label>
        {{form.selling_price}}
        <label>{{form.type_product.label}}</label>
        {{form.type_product}}
        <button type='submit' class='btn-submit'>Cadastrar</button>
        <button type="button" class="btn-canceled" onclick="window.location.href='{% url 'home' %}'">
            Cancelar
        </button>
    </div>
</form>
{% endblock  %}
